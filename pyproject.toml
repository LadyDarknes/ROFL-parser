[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rofl-replay-parser"
dynamic = ["version"]
description = "Offline inspection and build-specific event decoding for League of Legends ROFL2 replays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["zstandard>=0.23"]

[project.optional-dependencies]
combat = ["pefile>=2023.2.7", "unicorn>=2.1,<3"]

[project.scripts]
rofl-parser = "rofl_parser.cli:main"

[project.urls]
Repository = "https://github.com/LadyDarknes/ROFL-parser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rofl_parser.__version__"}
